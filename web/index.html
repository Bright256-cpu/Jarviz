<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J.A.R.V.I.S.</title>
<style>
  :root{
    --bg:#04090a; --cyan:#3df2d0; --cyan-dim:#1b7f6e; --amber:#f2b63d; --red:#ff5a5a;
    --panel:rgba(8,22,22,.72); --line:rgba(61,242,208,.35); --text:#bff7ec;
    --mono: ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #graph{z-index:0}
  #scan{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .4s;
    background:repeating-linear-gradient(0deg,rgba(61,242,208,.05) 0 1px,transparent 1px 3px);
    mix-blend-mode:screen}
  body.holo #scan{opacity:1;animation:flick 6s infinite}
  body.holo #hud{filter:drop-shadow(0 0 6px rgba(61,242,208,.55))}
  @keyframes flick{0%,96%,100%{opacity:1}97%{opacity:.6}98%{opacity:1}99%{opacity:.7}}

  #hud{position:fixed;inset:0;z-index:2;pointer-events:none}
  #hud>*{pointer-events:auto}

  /* counters */
  #counts{position:absolute;top:14px;right:14px;width:190px;padding:10px 12px;border:1px solid var(--line);
    background:var(--panel);border-radius:8px;font-size:12px;backdrop-filter:blur(6px)}
  #counts div{display:flex;align-items:center;gap:8px;padding:2px 0}
  #counts i{width:8px;height:8px;border-radius:50%;display:inline-block}
  #counts b{margin-left:auto;font-weight:500;opacity:.8}

  /* orb */
  #orbwrap{position:absolute;top:70px;right:60px;width:270px;height:270px}
  #orb{position:absolute;inset:0;width:100%;height:100%}
  #pills{position:absolute;top:350px;right:30px;width:330px;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .pill{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:5px 12px;border-radius:999px;
    font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;cursor:default;display:flex;gap:6px;align-items:center}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  .pill.mode{cursor:pointer;opacity:.55}
  .pill.mode.on{opacity:1;background:rgba(61,242,208,.18);border-color:var(--cyan)}
  body[data-state=thinking] #state .dot{background:var(--amber);box-shadow:0 0 8px var(--amber)}
  body[data-state=listening] #state .dot{background:#5aa8ff;box-shadow:0 0 8px #5aa8ff}
  body[data-state=error] #state .dot{background:var(--red);box-shadow:0 0 8px var(--red)}

  /* toggles */
  #toggles{position:absolute;right:30px;top:440px;width:190px;display:flex;flex-direction:column;gap:8px}
  .tog{display:flex;justify-content:space-between;border:1px solid var(--line);background:var(--panel);padding:7px 12px;
    border-radius:6px;font-size:11px;letter-spacing:.14em;cursor:pointer;user-select:none}
  .tog span:last-child{opacity:.55}
  .tog.on{border-color:var(--cyan)} .tog.on span:last-child{color:var(--cyan);opacity:1}

  /* left */
  #cloud{position:absolute;left:14px;bottom:200px;border:1px solid var(--cyan);padding:9px 14px;border-radius:6px;
    font-size:13px;letter-spacing:.18em;background:var(--panel);min-width:200px}
  #cloud small{display:block;opacity:.55;font-size:9px;letter-spacing:.12em;margin-top:3px}
  #title{position:absolute;top:14px;left:14px;font-size:11px;letter-spacing:.3em;opacity:.75}
  #cam{position:absolute;left:14px;top:44px;width:180px;border:1px solid var(--line);border-radius:6px;display:none;transform:scaleX(-1)}
  body.eyes #cam{display:block}

  /* chat */
  #chat{position:absolute;left:0;right:0;bottom:0;padding:0 14px 14px;max-width:760px}
  #log{max-height:150px;overflow:auto;font-size:13px;line-height:1.5;margin-bottom:8px;padding-right:6px;
    scrollbar-width:thin;scrollbar-color:var(--cyan-dim) transparent}
  #log p{margin:3px 0;padding:4px 10px;border-radius:6px;width:fit-content;max-width:100%;white-space:pre-wrap}
  #log .u{background:rgba(61,242,208,.1);border:1px solid var(--line);margin-left:auto;color:#fff}
  #log .a{background:var(--panel);border:1px solid rgba(61,242,208,.18)}
  #log .e{color:var(--red);border:1px solid var(--red)}
  #bar{display:flex;gap:8px}
  #in{flex:1;background:var(--panel);border:1px solid var(--line);color:#fff;padding:11px 14px;border-radius:10px;
    font:14px var(--mono);outline:none}
  #in:focus{border-color:var(--cyan)}
  button{background:var(--panel);border:1px solid var(--line);color:var(--cyan);border-radius:10px;padding:0 16px;
    font:600 12px var(--mono);letter-spacing:.1em;cursor:pointer}
  button:hover{background:rgba(61,242,208,.15)}
  #mic.on{background:#5aa8ff;color:#001;border-color:#5aa8ff}
  #hint{font-size:10px;opacity:.45;margin-top:6px;letter-spacing:.06em}

  @media(max-width:820px){
    #orbwrap{right:50%;transform:translateX(50%);top:50px;width:200px;height:200px}
    #pills{top:260px;right:10px;width:calc(100% - 20px)}
    #toggles,#counts{display:none} #cloud{display:none}
  }
</style>
</head>
<body data-state="idle" class="holo">
<canvas id="graph"></canvas>
<div id="scan"></div>

<div id="hud">
  <div id="title">J.A.R.V.I.S. // LOCAL</div>
  <video id="cam" autoplay muted playsinline></video>

  <div id="counts"></div>

  <div id="orbwrap"><canvas id="orb"></canvas></div>

  <div id="pills">
    <div class="row">
      <div class="pill" id="state"><span class="dot"></span><span id="statetxt">IDLE</span></div>
      <div class="pill" id="modelpill">◆ …</div>
    </div>
    <div class="row">
      <div class="pill mode on" data-mode="ring">Ring</div>
      <div class="pill mode" data-mode="cube">Cube</div>
      <div class="pill mode" data-mode="face">Face</div>
    </div>
  </div>

  <div id="toggles">
    <div class="tog" id="t-eyes"><span>EYES</span><span>off</span></div>
    <div class="tog on" id="t-holo"><span>HOLO</span><span>on</span></div>
    <div class="tog on" id="t-voice"><span>VOICE</span><span>on</span></div>
    <div class="tog on" id="t-reflex"><span>REFLEX</span><span>on</span></div>
  </div>

  <div id="cloud">LOCAL<small>100% on this machine · no cloud APIs</small></div>

  <div id="chat">
    <div id="log"></div>
    <div id="bar">
      <input id="in" placeholder="Talk to Jarvis…  (type, or press the mic)" autocomplete="off" autofocus>
      <button id="mic" title="Hold to talk / click to toggle">MIC</button>
      <button id="send">SEND</button>
    </div>
    <div id="hint">Try: “what time is it” · “remember that my gym is on Tuesdays” · “what do you remember about gym” · [[links]] in notes become graph edges</div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
